# fly.toml app configuration file generated for alter-api-young-lantern-9418 on 2026-08-20T06:10:49+05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'alter-api-young-lantern-9418'
# Frankfurt is closer to Central Asia / RU than Singapore (free region switch on redeploy).
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile'

[env]
  NODE_ENV = 'production'
  PORT = '8080'

[processes]
  app = 'node dist/index.js'
  telegram = 'node dist/scripts/telegramPoll.js'
  social = 'node dist/scripts/socialWorker.js'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '15s'
    timeout = '2s'
    grace_period = '20s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
  processes = ['telegram']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
  processes = ['social']

[[restart]]
  policy = 'never'
  processes = ['telegram']

[[restart]]
  policy = 'on-failure'
  processes = ['social']
