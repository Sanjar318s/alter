<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALTER — дом косплееров</title>
<style>
  :root{
    --bg: #15111a;
    --panel: #1c1620;
    --panel-2: #241c2c;
    --border: #322838;
    --text: #eee6f0;
    --text-dim: #a493ac;
    --magenta: #e6467a;
    --amber: #f2a541;
    --locked: #6b6070;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden}
  #app{display:flex;height:100vh}

  /* Sidebar */
  #sidebar{width:300px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
  #brand{padding:18px 16px 12px;border-bottom:1px solid var(--border)}
  #brand h1{margin:0;font-size:19px;background:linear-gradient(90deg,var(--magenta),var(--amber));-webkit-background-clip:text;background-clip:text;color:transparent}
  #brand small{color:var(--text-dim)}
  #search-box{padding:10px 14px}
  #search-box input{width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:var(--panel-2);color:var(--text);font-size:13px}
  #channel-list{overflow-y:auto;flex:1}
  .cat-label{padding:10px 16px 4px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-dim)}
  .chan-item{display:flex;align-items:center;gap:10px;padding:8px 16px;cursor:pointer;border-left:3px solid transparent}
  .chan-item:hover{background:var(--panel-2)}
  .chan-item.active{background:var(--panel-2);border-left-color:var(--magenta)}
  .chan-icon{font-size:18px;width:22px;text-align:center}
  .chan-name{font-size:14px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pin{color:var(--amber);font-size:11px}
  #user-switch{padding:12px 14px;border-top:1px solid var(--border);font-size:12px;color:var(--text-dim)}
  #user-switch select{width:100%;margin-top:4px;background:var(--panel-2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px}

  /* Main */
  #main{flex:1;display:flex;flex-direction:column;min-width:0}
  #chan-header{padding:14px 20px;border-bottom:1px solid var(--border);background:var(--panel)}
  #chan-header h2{margin:0 0 2px;font-size:16px}
  #chan-header p{margin:0;color:var(--text-dim);font-size:12px}
  #messages{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:14px}
  .msg{display:flex;gap:10px;max-width:640px}
  .avatar{width:36px;height:36px;border-radius:50%;background:var(--panel-2);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
  .msg-body{background:var(--panel-2);border-radius:10px;padding:8px 12px;border:1px solid var(--border)}
  .msg-head{display:flex;align-items:center;gap:6px;margin-bottom:2px}
  .msg-author{font-weight:600;font-size:13px}
  .badge-maker{font-size:10px;background:var(--magenta);color:#fff;padding:1px 6px;border-radius:10px}
  .msg-time{font-size:11px;color:var(--text-dim)}
  .msg-text{font-size:14px;line-height:1.4}
  .meta-card{margin-top:6px;border:1px dashed var(--border);border-radius:8px;padding:6px 10px;font-size:12px;color:var(--amber)}
  .reactions{display:flex;gap:6px;margin-top:6px}
  .reaction{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:1px 8px;font-size:12px;cursor:pointer}
  .reaction:hover{border-color:var(--magenta)}
  .add-react{cursor:pointer;color:var(--text-dim);font-size:12px}
  #composer{display:flex;gap:8px;padding:14px 20px;border-top:1px solid var(--border);background:var(--panel)}
  #composer input{flex:1;padding:10px 12px;border-radius:8px;border:1px solid var(--border);background:var(--panel-2);color:var(--text)}
  #composer button{padding:10px 18px;border:none;border-radius:8px;background:linear-gradient(90deg,var(--magenta),var(--amber));color:#1a1420;font-weight:700;cursor:pointer}
  #composer button:disabled{opacity:.4;cursor:not-allowed}
  .locked-note{padding:10px 20px;color:var(--locked);font-size:12px;font-style:italic}
  .meta-fields{display:flex;gap:8px;padding:0 20px 10px}
  .meta-fields input{flex:1;padding:6px 8px;border-radius:6px;border:1px solid var(--border);background:var(--panel-2);color:var(--text);font-size:12px}

  /* Right panel: profile / DM */
  #right{width:280px;border-left:1px solid var(--border);background:var(--panel);display:flex;flex-direction:column;flex-shrink:0}
  #right h3{padding:14px 16px 6px;margin:0;font-size:13px;color:var(--text-dim);text-transform:uppercase}
  .user-card{display:flex;gap:8px;align-items:center;padding:8px 16px;cursor:pointer}
  .user-card:hover{background:var(--panel-2)}
  .user-mini-name{font-size:13px;font-weight:600}
  .user-mini-bio{font-size:11px;color:var(--text-dim)}
  #dm-panel{flex:1;display:flex;flex-direction:column;border-top:1px solid var(--border)}
  #dm-header{padding:10px 16px;font-size:13px;font-weight:600;border-bottom:1px solid var(--border)}
  #dm-messages{flex:1;overflow-y:auto;padding:10px 14px;display:flex;flex-direction:column;gap:8px}
  .dm-msg{font-size:13px;background:var(--panel-2);border-radius:8px;padding:6px 10px;max-width:90%}
  .dm-msg.me{align-self:flex-end;background:linear-gradient(90deg,var(--magenta),var(--amber));color:#1a1420}
  #dm-compose{display:flex;gap:6px;padding:10px;border-top:1px solid var(--border)}
  #dm-compose input{flex:1;padding:6px 8px;border-radius:6px;border:1px solid var(--border);background:var(--panel-2);color:var(--text);font-size:12px}
  #dm-empty{padding:16px;color:var(--text-dim);font-size:12px}
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <div id="brand"><h1>ALTER</h1><small>дом для косплееров</small></div>
    <div id="search-box"><input id="search-input" placeholder="Поиск по всем каналам..."></div>
    <div id="channel-list"></div>
    <div id="user-switch">
      Вы вошли как:
      <select id="me-select"></select>
    </div>
  </div>

  <div id="main">
    <div id="chan-header"><h2 id="chan-title">—</h2><p id="chan-desc"></p></div>
    <div id="messages"></div>
    <div id="meta-fields" class="meta-fields" style="display:none"></div>
    <div id="locked-note" class="locked-note" style="display:none">🔒 Этот канал только для чтения (модераторский).</div>
    <div id="composer">
      <input id="msg-input" placeholder="Написать сообщение...">
      <button id="send-btn">Отправить</button>
    </div>
  </div>

  <div id="right">
    <h3>Участники</h3>
    <div id="user-list"></div>
    <div id="dm-panel">
      <div id="dm-header">Личные сообщения</div>
      <div id="dm-empty">Выберите участника выше, чтобы написать лично.</div>
      <div id="dm-messages" style="display:none"></div>
      <div id="dm-compose" style="display:none">
        <input id="dm-input" placeholder="Сообщение...">
        <button id="dm-send">→</button>
      </div>
    </div>
  </div>
</div>

<script>
const API = "";
let channels = [], users = [], me = "you", activeChannel = null, activeDmUser = null;

async function api(path, opts) {
  const res = await fetch(API + path, opts);
  return res.json();
}

function fmtTime(ts){
  const d = new Date(ts * 1000);
  return d.toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'});
}

async function loadChannels(){
  channels = await api('/api/channels');
  const byCat = {};
  channels.forEach(c => { (byCat[c.category] = byCat[c.category] || []).push(c); });
  const list = document.getElementById('channel-list');
  list.innerHTML = '';
  Object.entries(byCat).forEach(([cat, chans]) => {
    const label = document.createElement('div');
    label.className = 'cat-label';
    label.textContent = cat;
    list.appendChild(label);
    chans.forEach(c => {
      const item = document.createElement('div');
      item.className = 'chan-item' + (c.id === activeChannel ? ' active' : '');
      item.innerHTML = `<span class="chan-icon">${c.icon}</span><span class="chan-name">${c.name}</span>${c.pinned ? '<span class="pin">📌</span>' : ''}`;
      item.onclick = () => selectChannel(c.id);
      list.appendChild(item);
    });
  });
  if (!activeChannel && channels.length) selectChannel(channels[0].id);
}

function metaFieldsForType(type){
  switch(type){
    case 'event': return [{k:'date', ph:'Дата (ГГГГ-ММ-ДД)'}, {k:'location', ph:'Место'}];
    case 'market': return [{k:'item', ph:'Что продаёте'}, {k:'price', ph:'Цена'}];
    case 'search': return [{k:'role', ph:'Роль/персонаж'}, {k:'fandom', ph:'Фандом'}];
    default: return [];
  }
}

function renderMetaCard(type, meta){
  if (!meta || Object.keys(meta).length === 0) return '';
  if (type === 'event') return `<div class="meta-card">📅 ${meta.date || '?'} · 📍 ${meta.location || '?'}</div>`;
  if (type === 'market') return `<div class="meta-card">🏷️ ${meta.item || ''} — ${meta.price || '?'}</div>`;
  if (type === 'search') return `<div class="meta-card">🎭 Ищут: ${meta.role || '?'} (${meta.fandom || '?'})</div>`;
  return '';
}

async function selectChannel(id){
  activeChannel = id;
  await loadChannels();
  const chan = channels.find(c => c.id === id);
  document.getElementById('chan-title').textContent = `${chan.icon} ${chan.name}`;
  document.getElementById('chan-desc').textContent = chan.description || '';

  const metaWrap = document.getElementById('meta-fields');
  const fields = metaFieldsForType(chan.type);
  metaWrap.innerHTML = '';
  metaWrap.style.display = fields.length ? 'flex' : 'none';
  fields.forEach(f => {
    const inp = document.createElement('input');
    inp.placeholder = f.ph;
    inp.dataset.key = f.k;
    inp.id = 'meta-' + f.k;
    metaWrap.appendChild(inp);
  });

  const locked = !!chan.locked;
  document.getElementById('locked-note').style.display = locked ? 'block' : 'none';
  document.getElementById('composer').style.display = locked ? 'none' : 'flex';

  const msgs = await api(`/api/channels/${id}/messages`);
  renderMessages(msgs, chan.type);
}

function renderMessages(msgs, type){
  const box = document.getElementById('messages');
  box.innerHTML = '';
  msgs.forEach(m => {
    const el = document.createElement('div');
    el.className = 'msg';
    const reactHtml = Object.entries(m.reactions || {}).map(([e,c]) =>
      `<span class="reaction" onclick="react('${m.id}','${e}')">${e} ${c}</span>`).join('');
    el.innerHTML = `
      <div class="avatar">${m.author_avatar}</div>
      <div>
        <div class="msg-body">
          <div class="msg-head">
            <span class="msg-author">${m.author_name}</span>
            ${m.author_maker ? '<span class="badge-maker">мейкер</span>' : ''}
            <span class="msg-time">${fmtTime(m.ts)}</span>
          </div>
          <div class="msg-text">${escapeHtml(m.text)}</div>
          ${renderMetaCard(type, m.meta)}
        </div>
        <div class="reactions">${reactHtml}<span class="add-react" onclick="react('${m.id}','🔥')">+🔥</span></div>
      </div>`;
    box.appendChild(el);
  });
  box.scrollTop = box.scrollHeight;
}

function escapeHtml(s){
  const d = document.createElement('div'); d.innerText = s; return d.innerHTML;
}

async function react(msgId, emoji){
  await api(`/api/messages/${msgId}/react`, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({emoji})});
  selectChannel(activeChannel);
}

async function sendMessage(){
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if (!text) return;
  const meta = {};
  document.querySelectorAll('#meta-fields input').forEach(inp => { if (inp.value) meta[inp.dataset.key] = inp.value; });
  await api(`/api/channels/${activeChannel}/messages`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({author_id: me, text, meta})
  });
  input.value = '';
  document.querySelectorAll('#meta-fields input').forEach(inp => inp.value = '');
  selectChannel(activeChannel);
}

async function loadUsers(){
  users = await api('/api/users');
  const meSelect = document.getElementById('me-select');
  meSelect.innerHTML = users.map(u => `<option value="${u.id}" ${u.id===me?'selected':''}>${u.avatar} ${u.username}</option>`).join('');
  meSelect.onchange = () => { me = meSelect.value; };

  const list = document.getElementById('user-list');
  list.innerHTML = '';
  users.filter(u => u.id !== 'you').forEach(u => {
    const el = document.createElement('div');
    el.className = 'user-card';
    el.innerHTML = `<div class="avatar">${u.avatar}</div><div><div class="user-mini-name">${u.username}${u.maker?' 🛠️':''}</div><div class="user-mini-bio">${u.bio}</div></div>`;
    el.onclick = () => openDm(u.id, u.username);
    list.appendChild(el);
  });
}

async function openDm(uid, name){
  activeDmUser = uid;
  document.getElementById('dm-header').textContent = 'Личные сообщения — ' + name;
  document.getElementById('dm-empty').style.display = 'none';
  document.getElementById('dm-messages').style.display = 'flex';
  document.getElementById('dm-compose').style.display = 'flex';
  await refreshDm();
}

async function refreshDm(){
  if (!activeDmUser) return;
  const msgs = await api(`/api/dms/${activeDmUser}?me=${me}`);
  const box = document.getElementById('dm-messages');
  box.innerHTML = msgs.map(m => `<div class="dm-msg ${m.author_id===me?'me':''}">${escapeHtml(m.text)}</div>`).join('');
  box.scrollTop = box.scrollHeight;
}

async function sendDm(){
  const input = document.getElementById('dm-input');
  const text = input.value.trim();
  if (!text || !activeDmUser) return;
  await api(`/api/dms/${activeDmUser}`, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({me, text})});
  input.value = '';
  refreshDm();
}

async function doSearch(q){
  if (!q){ selectChannel(activeChannel); return; }
  const results = await api('/api/search?q=' + encodeURIComponent(q));
  document.getElementById('chan-title').textContent = `🔎 Результаты: "${q}"`;
  document.getElementById('chan-desc').textContent = `${results.length} совпадений по всем каналам`;
  document.getElementById('composer').style.display = 'none';
  document.getElementById('meta-fields').style.display = 'none';
  document.getElementById('locked-note').style.display = 'none';
  renderMessages(results, null);
}

document.getElementById('send-btn').onclick = sendMessage;
document.getElementById('msg-input').addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });
document.getElementById('dm-send').onclick = sendDm;
document.getElementById('dm-input').addEventListener('keydown', e => { if (e.key === 'Enter') sendDm(); });
let searchTimer;
document.getElementById('search-input').addEventListener('input', e => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => doSearch(e.target.value.trim()), 250);
});

(async function init(){
  await loadUsers();
  await loadChannels();
})();
</script>
</body>
</html>
