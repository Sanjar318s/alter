<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="duotone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E5487A"/>
      <stop offset="1" stop-color="#F2A93B"/>
    </linearGradient>
  </defs>
  <!-- base -->
  <rect width="1024" height="1024" fill="#12101A"/>
  <!-- subtle stage vignette -->
  <rect width="1024" height="1024" fill="url(#duotone)" opacity="0.10"/>

  <!-- corner marks, scaled up as the icon's core mark -->
  <g stroke-linecap="square">
    <!-- top-left -->
    <path d="M 220 340 L 220 220 L 340 220" fill="none" stroke="#E5487A" stroke-width="26"/>
    <!-- top-right -->
    <path d="M 684 220 L 804 220 L 804 340" fill="none" stroke="#E5487A" stroke-width="26"/>
    <!-- bottom-left -->
    <path d="M 220 684 L 220 804 L 340 804" fill="none" stroke="#F2A93B" stroke-width="26"/>
    <!-- bottom-right -->
    <path d="M 804 684 L 804 804 L 684 804" fill="none" stroke="#F2A93B" stroke-width="26"/>
  </g>

  <!-- center mark: the "A" of ALTER reduced to a duotone triangle/aperture shape -->
  <path d="M 512 380 L 640 660 L 384 660 Z" fill="none" stroke="url(#duotone)" stroke-width="20" stroke-linejoin="round"/>
  <circle cx="512" cy="560" r="14" fill="#F2EEE9"/>
</svg>
