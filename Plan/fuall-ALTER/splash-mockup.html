<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>ALTER — Splash screen mockup</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@800&family=Space+Mono:wght@400&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#0A0912;display:flex;gap:32px;flex-wrap:wrap;padding:48px;font-family:'Space Mono',monospace;color:#F2EEE9;}
.phone{
  width:320px;height:693px;
  background:#12101A;
  border-radius:44px;
  border:8px solid #1D1A29;
  position:relative;
  overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 20px 60px rgba(0,0,0,.5);
}
.phone::before{ /* notch */
  content:'';position:absolute;top:8px;left:50%;transform:translateX(-50%);
  width:120px;height:24px;background:#000;border-radius:0 0 16px 16px;z-index:5;
}
.label{font-size:12px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:12px;color:#F2A93B;}
.duotone-bg{
  position:absolute;inset:0;
  background: radial-gradient(120% 90% at 20% 15%, rgba(229,72,122,.55), transparent 60%),
              radial-gradient(120% 90% at 85% 90%, rgba(242,169,59,.5), transparent 60%),
              #12101A;
}
.mark{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:18px;}
.corner-logo{width:96px;height:96px;position:relative;}
.corner-logo svg{width:100%;height:100%;}
.wordmark{font-family:'Syne',sans-serif;font-weight:800;font-size:28px;letter-spacing:.02em;}
.tagline{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:rgba(242,238,233,.6);}

/* variant: no gradient, matches specAppDizain §2 rule "gradient used sparingly except onboarding screen 1" */
.plain-bg{background:#12101A;}
.dot{width:10px;height:10px;background:linear-gradient(135deg,#E5487A,#F2A93B);border-radius:1px;}
</style>
</head>
<body>

<div>
  <div class="label">Splash / launch screen — cold start</div>
  <div class="phone">
    <div class="duotone-bg"></div>
    <div class="mark">
      <div class="corner-logo">
        <svg viewBox="0 0 200 200">
          <path d="M 40 70 L 40 40 L 70 40" fill="none" stroke="#E5487A" stroke-width="6"/>
          <path d="M 130 40 L 160 40 L 160 70" fill="none" stroke="#E5487A" stroke-width="6"/>
          <path d="M 40 130 L 40 160 L 70 160" fill="none" stroke="#F2A93B" stroke-width="6"/>
          <path d="M 160 130 L 160 160 L 130 160" fill="none" stroke="#F2A93B" stroke-width="6"/>
          <path d="M 100 78 L 128 130 L 72 130 Z" fill="none" stroke="#F2EEE9" stroke-width="5"/>
        </svg>
      </div>
      <div class="wordmark">ALTER</div>
    </div>
  </div>
</div>

<div>
  <div class="label">Home screen icon — adaptive icon preview (Android)</div>
  <div class="phone" style="height:320px;align-items:flex-start;padding-top:40px;">
    <div class="plain-bg" style="position:absolute;inset:0;"></div>
    <div style="position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:10px;">
      <div style="width:72px;height:72px;border-radius:16px;overflow:hidden;background:#12101A;display:flex;align-items:center;justify-content:center;">
        <svg viewBox="0 0 200 200" style="width:56px;height:56px;">
          <path d="M 40 70 L 40 40 L 70 40" fill="none" stroke="#E5487A" stroke-width="8"/>
          <path d="M 130 40 L 160 40 L 160 70" fill="none" stroke="#E5487A" stroke-width="8"/>
          <path d="M 40 130 L 40 160 L 70 160" fill="none" stroke="#F2A93B" stroke-width="8"/>
          <path d="M 160 130 L 160 160 L 130 160" fill="none" stroke="#F2A93B" stroke-width="8"/>
          <path d="M 100 78 L 128 130 L 72 130 Z" fill="none" stroke="#F2EEE9" stroke-width="7"/>
        </svg>
      </div>
      <div class="tagline" style="color:#F2EEE9;font-size:10px;">ALTER</div>
    </div>
  </div>
</div>

</body>
</html>
